<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EAE0CC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1F1C17" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Apprendre les hiragana en les écrivant de mémoire, avec répétition espacée.">
  <title>Takoyaki desu</title>
  <script>try{var t=localStorage.getItem("takoyaki-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="preload" href="fonts/zen-kaku-gothic-new-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/shippori-mincho-b1-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <div class="app">
    <header>
      <div class="brand"><span class="seal" aria-hidden="true">蛸</span><span class="name">たこ焼きです</span><span class="sr-only">Takoyaki desu</span></div>
      <div class="prof" id="prof"></div>
    </header>
    <nav>
      <a href="#seance"><b aria-hidden="true">習</b>Séance</a><a href="#progres"><b aria-hidden="true">歩</b>Progrès</a><a href="#examen"><b aria-hidden="true">試</b>Examen</a><a href="#reglages"><b aria-hidden="true">設</b>Réglages</a>
    </nav>
    <main id="view"></main>
  </div>
  <svg class="wave" aria-hidden="true"><defs><pattern id="seigaiha" width="32" height="16" patternUnits="userSpaceOnUse"><rect width="32" height="16" style="fill:var(--paper)"/><g><circle cx="16" cy="-8" r="16" style="fill:var(--paper);stroke:var(--wood)" stroke-width=".8"/><circle cx="16" cy="-8" r="11" fill="none" style="stroke:var(--wood)" stroke-width=".5"/><circle cx="16" cy="-8" r="6" fill="none" style="stroke:var(--wood)" stroke-width=".5"/></g><g><circle cx="0" cy="0" r="16" style="fill:var(--paper);stroke:var(--wood)" stroke-width=".8"/><circle cx="0" cy="0" r="11" fill="none" style="stroke:var(--wood)" stroke-width=".5"/><circle cx="0" cy="0" r="6" fill="none" style="stroke:var(--wood)" stroke-width=".5"/></g><g><circle cx="32" cy="0" r="16" style="fill:var(--paper);stroke:var(--wood)" stroke-width=".8"/><circle cx="32" cy="0" r="11" fill="none" style="stroke:var(--wood)" stroke-width=".5"/><circle cx="32" cy="0" r="6" fill="none" style="stroke:var(--wood)" stroke-width=".5"/></g><g><circle cx="16" cy="8" r="16" style="fill:var(--paper);stroke:var(--wood)" stroke-width=".8"/><circle cx="16" cy="8" r="11" fill="none" style="stroke:var(--wood)" stroke-width=".5"/><circle cx="16" cy="8" r="6" fill="none" style="stroke:var(--wood)" stroke-width=".5"/></g><g><circle cx="0" cy="16" r="16" style="fill:var(--paper);stroke:var(--wood)" stroke-width=".8"/><circle cx="0" cy="16" r="11" fill="none" style="stroke:var(--wood)" stroke-width=".5"/><circle cx="0" cy="16" r="6" fill="none" style="stroke:var(--wood)" stroke-width=".5"/></g><g><circle cx="32" cy="16" r="16" style="fill:var(--paper);stroke:var(--wood)" stroke-width=".8"/><circle cx="32" cy="16" r="11" fill="none" style="stroke:var(--wood)" stroke-width=".5"/><circle cx="32" cy="16" r="6" fill="none" style="stroke:var(--wood)" stroke-width=".5"/></g><g><circle cx="16" cy="24" r="16" style="fill:var(--paper);stroke:var(--wood)" stroke-width=".8"/><circle cx="16" cy="24" r="11" fill="none" style="stroke:var(--wood)" stroke-width=".5"/><circle cx="16" cy="24" r="6" fill="none" style="stroke:var(--wood)" stroke-width=".5"/></g></pattern></defs><rect width="100%" height="100%" fill="url(#seigaiha)"/></svg>
  <script type="module" src="/src/main.ts"></script>

</html>
